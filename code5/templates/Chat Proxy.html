<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Proxy – Clean Light UI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{
      --bg:#ffffff; --panel:#ffffff; --muted:#f6f8fb; --ring:#e6eaf2;
      --text:#101828; --sub:#667085;
      --blue:#2563eb; --blue-2:#60a5fa; --mint:#10b981;
      --danger:#ef4444; --success:#16a34a; --shadow:0 10px 24px rgba(16,24,40,.06);
      --radius:16px; --radius-sm:12px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:
          radial-gradient(800px 300px at 80% -80px, rgba(37,99,235,.08), transparent),
          radial-gradient(600px 240px at -100px -120px, rgba(16,185,129,.06), transparent),
          var(--bg);color:var(--text);font:500 15px/1.55 "Pretendard","Inter","Noto Sans KR",system-ui}
    .layout{display:grid;grid-template-columns:280px 1fr;gap:0;height:100vh}

    /* drag & drop */
    .drop-zone {
      position: relative; /* 자식 요소(overlay)의 기준점 */
    }

    .drop-zone-overlay {
      position: absolute;
      inset: 0; /* 부모 요소(drop-zone)를 꽉 채움 */
      background-color: rgba(37, 99, 235, 0.1); /* 반투명 파란색 배경 */
      border: 2px dashed var(--blue);
      border-radius: var(--radius);
      display: none; /* 평소에는 숨김 */
      place-items: center; /* 중앙 정렬 */
      font-weight: 600;
      color: var(--blue);
      pointer-events: none; /* 아래 요소 클릭 방해 금지 */
      z-index: 10;
    }

    .drop-zone.dragover .drop-zone-overlay {
      display: grid; /* 드래그 중일 때만 보이게 함 */
    }
    
    /* Sidebar */
    .sidebar{background:#f8fafc;backdrop-filter:saturate(1.1);border-right:1px solid var(--ring);padding:16px 14px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .logo{width:28px;height:28px;border-radius:10px;background:conic-gradient(from 180deg,var(--blue),var(--mint),var(--blue));box-shadow:0 0 0 3px rgba(59,130,246,.12)}
    .brand h1{font-size:16px;margin:0;letter-spacing:.2px}
    .sb-btn{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;margin:6px 0;border:1px solid var(--ring);background:var(--panel);color:var(--text);border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
    .sb-btn.primary{background:linear-gradient(180deg,rgba(37,99,235,.10),rgba(37,99,235,.04));border-color:#c7d7fe}
    .group-title{font-size:12px;color:#98a2b3;margin:16px 6px 8px}
    .recent{flex:1;overflow:auto;border-top:1px dashed var(--ring);margin-top:12px;padding-top:12px}
    .recent .item{padding:8px 10px;border-radius:10px;display:block;color:inherit;text-decoration:none;border:1px solid transparent}
    .recent .item:hover{background:#eef2f7;border-color:var(--ring)}

    /* Main */
    .main{display:grid;grid-template-rows:auto 1fr auto;height:100vh;background:var(--bg)}
    .topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--ring);background:var(--panel)}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px dashed var(--ring);color:#98a2b3;background:#fff}
    .status{width:8px;height:8px;border-radius:50%;background:#9aa4b2}
    .status.ok{background:var(--success)}
    .status.err{background:var(--danger)}
    .grow{flex:1}
    .select, .btn{border:1px solid var(--ring);background:var(--panel);color:var(--text);border-radius:12px;box-shadow:var(--shadow)}
    .select{padding:8px 10px}
    .btn{padding:10px 14px;cursor:pointer}

    /* Home */
    .home{display:grid;place-items:center;padding:40px}
    .hero{max-width:760px;text-align:center}
    .hero h2{--g:linear-gradient(90deg,var(--blue),var(--blue-2));background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:40px;font-weight:800;letter-spacing:-.3px;margin:24px 0}
    .hero p{color:var(--sub);margin:0 0 24px}
    .name-chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ring);border-radius:999px;padding:6px 10px;background:#fff;color:#475467;font-size:12px}
    .name-chip button{border:0;background:transparent;color:var(--blue);cursor:pointer}
    .search{display:flex;gap:10px;border:1px solid var(--ring);background:#fff;border-radius:16px;padding:12px 14px;align-items:center;box-shadow:var(--shadow)}
    .search input{flex:1;background:transparent;border:0;outline:none;color:var(--text);font-size:16px}
    .search .btn{background:linear-gradient(180deg,rgba(37,99,235,.12),rgba(37,99,235,.04));border-color:#c7d7fe}

    /* Chat view */
    .chat{display:none;grid-template-rows:1fr auto;height:calc(100vh - 58px)}
    .history{overflow:auto;padding:16px 18px}
    .msg{display:flex;gap:12px;margin:14px 0}
    .avatar{width:34px;height:34px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;color:#475467;border:1px solid var(--ring)}
    .bubble{max-width:75%;padding:12px 14px;border:1px solid var(--ring);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
    .user .bubble{margin-left:auto;background:linear-gradient(180deg,rgba(37,99,235,.08),rgba(37,99,235,.02));border-top-right-radius:6px}
    .assistant .bubble{background:#ffffff;border-top-left-radius:6px}
    .role{font-size:12px;color:#98a2b3;margin-bottom:6px}

    .composer{position:sticky;bottom:0;backdrop-filter:saturate(1.1);padding:12px 18px;border-top:1px solid var(--ring);background:#ffffff}
    .composer-inner{display:flex;gap:10px;align-items:flex-end;max-width:980px;margin:0 auto}
    textarea{flex:1;min-height:52px;max-height:180px;resize:vertical;border:1px solid var(--ring);background:#fff;color:var(--text);padding:12px 12px 14px;border-radius:12px;outline:none;box-shadow:var(--shadow)}
    textarea::placeholder{color:#98a2b3}

    @media (max-width:980px){.layout{grid-template-columns:1fr} .sidebar{display:none} .hero h2{font-size:30px} .bubble{max-width:100%}}

    .security-notice {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--ring);
      font-size: 13px;
      color: var(--sub);
      opacity: 0.8;
    }

    /* 응답 포맷 스타일 개선 */
    .content h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin: 18px 0 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e6eaf2;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .content h3 {
      font-size: 14px;
      font-weight: 600;
      color: #475467;
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .content ul, .content ol {
      margin: 8px 0;
      padding-left: 24px;
      line-height: 1.7;
    }

    .content li {
      margin: 6px 0;
      color: var(--text);
    }

    .content li::marker {
      color: var(--blue);
      font-weight: 600;
    }

    .content strong {
      color: var(--text);
      font-weight: 600;
      background: linear-gradient(180deg, transparent 60%, rgba(37,99,235,.12) 60%);
      padding: 0 2px;
    }

    .content code {
      background: #f6f8fb;
      color: #e11d48;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Consolas', 'Monaco', monospace;
      border: 1px solid #e6eaf2;
    }

    .content pre {
      background: #f6f8fb;
      border: 1px solid var(--ring);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 10px 0;
    }

    .content pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: var(--text);
    }

    .content p {
      margin: 8px 0;
      line-height: 1.7;
    }

    .content br {
      display: block;
      content: '';
      margin: 4px 0;
    }

    /* 섹션 구분 강화 */
    .content > div {
      margin: 12px 0;
    }

    .assistant .bubble {
      background: linear-gradient(180deg, #ffffff, #fafbfc);
      border-color: #e0e7f0;
    }
</style>
</head>
<body class="drop-zone">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="logo"></div><h1>Chat Proxy</h1></div>
      <button class="sb-btn primary" id="newChatBtn">＋ 새 채팅</button>
      <div class="group-title">최근</div>
      <div class="recent" id="recentList"></div>
    </aside>

    <main class="main">
      <div class="topbar">
        <span class="pill"><span class="status" id="healthDot"></span> 프록시 상태</span>
        <div class="grow"></div>
        <select id="model" class="select" aria-label="모델 선택">
          <!-- Gemini 2.x 시리즈 -->
          <optgroup label="🔥 Gemini 2.x (최신)">
            <option value="gemini-2.0-flash" selected>Gemini 2.0 Flash (RPM: 2K)</option>
            <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite (RPM: 4K)</option>
            <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash Exp (RPM: 10)</option>
          </optgroup>
          
          <!-- Gemini 2.5 시리즈 -->
          <optgroup label="⚡ Gemini 2.5">
            <option value="gemini-2.5-flash">Gemini 2.5 Flash (RPM: 1K)</option>
            <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite (RPM: 4K)</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro (RPM: 150)</option>
            <option value="gemini-2.5-pro-exp">Gemini 2.5 Pro Exp (RPM: 150)</option>
          </optgroup>
          
          <!-- Gemini 3 시리즈 -->
          <optgroup label="🚀 Gemini 3">
            <option value="gemini-3-pro">Gemini 3 Pro (RPM: 25)</option>
          </optgroup>
          
          <!-- Gemma 시리즈 -->
          <optgroup label="🤖 Gemma (경량)">
            <option value="gemma-3-27b">Gemma 3 27B (RPM: 30)</option>
            <option value="gemma-3-12b">Gemma 3 12B (RPM: 30)</option>
            <option value="gemma-3-4b">Gemma 3 4B (RPM: 30)</option>
            <option value="gemma-3-2b">Gemma 3 2B (RPM: 30)</option>
            <option value="gemma-3-1b">Gemma 3 1B (RPM: 30)</option>
          </optgroup>
          
          <!-- Ollama 로컬 모델 -->
          <optgroup label="💻 Ollama (로컬)">
            <option value="ollama:qwen3:8b">Ollama - qwen3:8b</option>
            <option value="ollama:llama3.1:8b">Ollama - llama3.1:8b</option>
            <option value="ollama:mistral:7b">Ollama - mistral:7b</option>
          </optgroup>
          
          <!-- 기타 -->
          <optgroup label="🔧 기타">
            <option value="demo-local">DEMO (로컬 에코)</option>
          </optgroup>
        </select>
      </div>

      <section class="home" id="home">
        <div class="hero">
          <h2 id="greet">안녕하세요.</h2>
          <p>무엇을 도와드릴까요? 민감한 정보는 프록시가 자동으로 점검하고 처리합니다.</p>
          <div style="margin:8px 0 18px">
            <span class="name-chip">표시 이름: <strong id="namePreview">비개인화</strong> <button id="editNameBtn">변경</button></span>
          </div>
          <div class="search">
            <input id="homeInput" placeholder="질문을 입력하세요…" />
            
            <!-- 파일 첨부 기능 제거 -->
            <!-- <button class="btn" id="fileBtnHome" title="파일 첨부 (.txt, .pdf)">📎</button>
            <input type="file" id="fileInputHome" accept=".txt,.pdf" hidden /> -->

            <button class="btn" id="homeSend">보내기</button>
          </div>
          <!-- <div id="filePreviewHome" style="font-size: 13px; color: var(--sub); margin-top: 10px;"></div> -->
        </div>
      </section>

      <section class="logs" id="logs" style="display:none; padding:16px;">
        <h2>감사 로그</h2>
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse;">
            <thead>
              <tr style="background-color:#f6f8fb;">
                <th style="padding:10px; text-align:left; border-bottom:1px solid #e6eaf2;">시간</th>
                <th style="padding:10px; text-align:left; border-bottom:1px solid #e6eaf2;">입력 프롬프트</th>
                <th style="padding:10px; text-align:left; border-bottom:1px solid #e6eaf2;">탐지 내역</th>
                <th style="padding:10px; text-align:left; border-bottom:1px solid #e6eaf2;">LLM 응답</th>
                <th style="padding:10px; text-align:left; border-bottom:1px solid #e6eaf2;">액션</th>
              </tr>
            </thead>
            <tbody id="logTableBody">
              </tbody>
          </table>
        </div>
      </section>

      <section class="chat" id="chat">
        <div class="history" id="history" aria-live="polite"></div>
        <div class="composer">
          <div class="composer-inner">
            <textarea id="input" placeholder="메시지를 입력하세요… (Enter: 전송, Shift+Enter: 줄바꿈)" spellcheck="false"></textarea>
            
            <!-- 파일 첨부 기능 제거 -->
            <!-- <button class="btn" id="fileBtn" title="파일 첨부 (.txt, .pdf)">📎</button>
            <input type="file" id="fileInput" accept=".txt,.pdf" hidden /> -->
            <button class="btn" id="sendBtn">보내기</button>

        </div>
      </section>
    </main>
  </div>

  <template id="msgTpl">
    <div class="msg">
      <div class="bubble">
        <div class="role" data-role-label></div>
        <div class="content"></div>
      </div>
    </div>
  </template>

  <script>
// === Config ===
const API_BASE = "";
const ENDPOINT = { chat: `${API_BASE}/chat`, health: `${API_BASE}/health`, logs: `${API_BASE}/api/admin/logs` }; // 로그 엔드포인트 수정

// === Elements ===
const el = (s) => document.querySelector(s);
const historyEl = el('#history');
const input = el('#input');
const sendBtn = el('#sendBtn');
const modelSel = el('#model');
const healthDot = el('#healthDot');
const recentList = el('#recentList');
const home = el('#home');
const chat = el('#chat');
const homeInput = el('#homeInput');
const homeSend = el('#homeSend');
const newChatBtn = el('#newChatBtn');
const greet = el('#greet');
const namePreview = el('#namePreview');
const editNameBtn = el('#editNameBtn');
const logsEl = el('#logs');
const logsTableBody = el('#logTableBody');
const logsBtn = el('#logsBtn');
const policiesBtn = el('#policiesBtn'); // policiesBtn 추가
// 파일 첨부 기능 제거로 인해 주석 처리
// const fileBtnHome = el('#fileBtnHome');
// const fileInputHome = el('#fileInputHome');
// const filePreviewHome = el('#filePreviewHome');
// const fileBtn = el('#fileBtn');
// const fileInput = el('#fileInput');
// const filePreview = el('#filePreview');
const dropZone = el('body'); // 드롭 영역 (body 전체)

// === State === (selectedFile 통합, 한 번만 선언)
const state = { messages: [], sending: false, recents: [], selectedFile: null };

// === Helper Functions ===

// 파일 상태 초기화 (파일 첨부 기능 제거로 간소화)
function clearFileSelection(previewElementId = null) {
  state.selectedFile = null; // 공통 상태 초기화
}

// 파일 선택 처리 (파일 첨부 기능 제거로 사용 안 함)
// function handleFileSelect(file, previewElementId) { ... }

// View 전환
function toView(viewName, text = '', fileToProcess = null) { 
  home.style.display = 'none';
  chat.style.display = 'none';
  logsEl.style.display = 'none';

  if (viewName === 'home') {
    home.style.display = 'grid';
    // 홈으로 올 때 파일 상태 초기화
    clearFileSelection(); 
  } else if (viewName === 'chat') {
    chat.style.display = 'grid';
    // 홈에서 채팅 시작 시 (text나 fileToProcess가 있을 경우)
    if (text || fileToProcess) { 
      let userMsg = text || `📄 ${fileToProcess.name} 전송`;
      pushUser(userMsg); // 사용자 메시지 표시
      // reply 함수 호출 시 파일 객체 전달
      reply(userMsg, fileToProcess); 
      // 중요: reply 호출 후 state.selectedFile 초기화 (reply 함수 내에서 처리할 수도 있음)
      // clearFileSelection(); // reply 함수 내부에서 초기화하므로 여기서 호출 안 함
    } else {
      render(); // 기존 대화 불러오기 (파일 없음)
    }
    // 채팅 화면 진입 시 최근 목록 업데이트는 reply 함수에서 처리하므로 여기서는 불필요
    // addRecentPreview(); // 중복 호출 제거
  } else if (viewName === 'logs') {
    logsEl.style.display = 'block';
    fetchAndRenderLogs();
  }
}

// 로그 렌더링
async function fetchAndRenderLogs() {
  logsTableBody.innerHTML = '<tr><td colspan="5">로그 로딩 중...</td></tr>'; // 로딩 표시 추가
  try {
    const res = await fetch(ENDPOINT.logs, { cache: 'no-store' });
    if (!res.ok) throw new Error(`로그를 불러오는 데 실패했습니다. (${res.status})`);
    const logs = await res.json();

    if (logs.length === 0) {
        logsTableBody.innerHTML = '<tr><td colspan="5">표시할 로그가 없습니다.</td></tr>';
        return;
    }

    logsTableBody.innerHTML = ''; // 이전 내용 지우기
    logs.forEach(log => {
      const row = document.createElement('tr');
      // ts를 Date 객체로 파싱 (ISO 문자열 Z 포함)
      const timestamp = new Date(log.ts).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'medium'});
      // detections_in이 pii 필드로 오므로 수정
      const detections = (log.pii || []).join(', ') || '없음'; 
      // action 필드를 직접 사용
      const actionDisplay = log.action === 'block' ? '차단' : (log.action === 'mask' ? '마스킹' : '통과'); 

      row.innerHTML = `
        <td style="padding:10px; border-bottom:1px solid #e6eaf2;">${timestamp}</td>
        <td style="padding:10px; border-bottom:1px solid #e6eaf2; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(log.user_prompt || '')}">${escapeHtml(log.user_prompt || '').substring(0, 50)}${(log.user_prompt || '').length > 50 ? '...' : ''}</td>
        <td style="padding:10px; border-bottom:1px solid #e6eaf2;">${escapeHtml(detections)}</td>
        <td style="padding:10px; border-bottom:1px solid #e6eaf2; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(log.llm_response || '')}">${escapeHtml(log.llm_response || '').substring(0, 50)}${(log.llm_response || '').length > 50 ? '...' : ''}</td>
        <td style="padding:10px; border-bottom:1px solid #e6eaf2;">${actionDisplay}</td>
      `;
      logsTableBody.appendChild(row);
    });
  } catch (err) {
    logsTableBody.innerHTML = `<tr><td colspan="5" style="padding:10px; color:#ef4444;">오류: ${err.message}</td></tr>`;
  }
}


// 이름 로드/저장/업데이트
function loadName() { return localStorage.getItem('displayName') || ''; }
function saveName(n) { if (n) localStorage.setItem('displayName', n); else localStorage.removeItem('displayName'); }
function updateGreeting() {
  const hello = '안녕하세요';
  const name = loadName();
  greet.textContent = name ? `${hello}, ${name}` : `${hello}.`;
  namePreview.textContent = name ? name : '비개인화';
}

// 렌더링 관련 함수들
function render() {
  historyEl.innerHTML = '';
  state.messages.forEach((m) => historyEl.appendChild(messageNode(m)));
  // 새 메시지 추가 후 스크롤 맨 아래로 이동
  requestAnimationFrame(() => {
     historyEl.scrollTop = historyEl.scrollHeight;
  });
  renderRecents(); // 최근 목록도 업데이트
}

function renderRecents() {
  recentList.innerHTML = '';
  state.recents.forEach((r, i) => {
    const a = document.createElement('a');
    a.href = '#';
    a.className = 'item';
    // 제목이 너무 길면 자르기
    a.textContent = (r.title || `대화 ${i + 1}`).substring(0, 20) + ((r.title || '').length > 20 ? '...' : '');
    a.title = r.title || `대화 ${i + 1}`; // 전체 제목은 툴팁으로
    a.onclick = (e) => {
      e.preventDefault();
      // 대화 복원 시 파일 상태 초기화
      clearFileSelection();
      state.messages = JSON.parse(r.snapshot);
      toView('chat'); // 이전 대화 내용만 불러오도록 수정
    };
    recentList.appendChild(a);
  });
}

function messageNode(m) {
  const tpl = el('#msgTpl');
  const node = tpl.content.firstElementChild.cloneNode(true);
  const label = node.querySelector('[data-role-label]');
  const content = node.querySelector('.content');
  const bubble = node.querySelector('.bubble');

  node.classList.add(m.role === 'user' ? 'user' : 'assistant');
  label.textContent = m.role === 'user' ? (loadName() || '사용자') : '어시스턴트'; // 이름 표시
  content.innerHTML = renderMarkdownSafe(m.content);

  if (m.notice) {
    const noticeEl = document.createElement('div');
    noticeEl.className = 'security-notice';
    noticeEl.textContent = m.notice;
    bubble.appendChild(noticeEl);
  }
  return node;
}

function renderMarkdownSafe(t) {
  if (!t) return '';
  let html = escapeHtml(t);
  
  // 코드 블록
  html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  
  // 섹션 헤더 (## 법령, ## 근거 등)
  html = html.replace(/^## (.+)$/gm, (match, title) => {
    const icon = getIconForSection(title);
    return `<h2>${icon} ${title}</h2>`;
  });
  
  // 서브 헤더 (### 또는 - [제목])
  html = html.replace(/^### (.+)$/gm, '<h3>▸ $1</h3>');
  html = html.replace(/^- \[([^\]]+)\](.*)$/gm, '<h3>▸ $1</h3><p style="margin-left:20px">$2</p>');
  
  // 리스트 항목 (1. 2. 3. 형식)
  html = html.replace(/^(\d+)\. (.+)$/gm, '<div style="margin:8px 0"><strong style="color:var(--blue)">$1.</strong> $2</div>');
  
  // 강조 (** **)
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  
  // 인라인 코드
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // 줄바꿈
  html = html.replace(/\n\n/g, '<br/><br/>');
  html = html.replace(/\n/g, '<br/>');
  
  return html;
}

function getIconForSection(title) {
  const icons = {
    '법령': '⚖️',
    '근거': '📋',
    '근거 출처': '📋',
    '로 키워드': '🔎',
    '단계': '📝',
    '더욱 단계': '📝',
    '다음 단계': '📝',
    '문의사항': '❓',
    '체크리스트': '✅',
    '주의사항': '⚠️'
  };
  return icons[title] || '📌';
}

function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// === Chat Logic ===
function pushUser(content) {
  // 빈 메시지 추가 방지
  if (!content || !content.trim()) return;
  state.messages.push({ role: 'user', content: content.trim() });
  input.value = ''; // 입력창 비우기
  render();
}

async function send() {
  console.log('[send] 함수 호출됨');
  const content = input.value.trim();
  const file = state.selectedFile;
  console.log('[send] content:', content, 'file:', file, 'sending:', state.sending);
  // 텍스트도 없고 파일도 없거나, 전송 중이면 무시
  if ((!content && !file) || state.sending) {
    console.log('[send] 전송 취소됨 (내용 없음 또는 전송 중)');
    return;
  }

  let messageToSend = content;
  // 파일만 보낼 경우, 파일 이름으로 사용자 메시지 표시
  if (!content && file) {
      messageToSend = `📄 ${file.name} 전송`;
  }
  
  // 메시지 배열에 추가하고 화면 렌더링
  if (messageToSend) {
      pushUser(messageToSend);
  }
  
  const fileToSend = file; // reply 함수에 전달할 파일 저장
  clearFileSelection(); // 파일 상태 초기화 (중요)

  // 비동기 응답 처리 시작
  reply(messageToSend, fileToSend); 
}


async function reply(userMessage, attachedFile) { // file 인자 사용
  state.sending = true;
  sendBtn.disabled = true;
  sendBtn.textContent = '전송 중…';
  const model = modelSel.value;

  const formData = new FormData();
  formData.append('model', model);
  // 'messages'는 마지막 사용자 메시지를 제외하고 보냄 (서버에서 추가할 것이므로)
  const messagesForApi = state.messages.slice(0, -1);
  formData.append('messages', JSON.stringify(messagesForApi));
  // 실제 사용자 입력 원문 (파일 이름 표시 메시지 말고)
  formData.append('user_prompt_text', userMessage); 

  if (attachedFile) {
    formData.append('file', attachedFile);
  }

  try {
    const res = await fetch(ENDPOINT.chat, {
      method: 'POST',
      body: formData
    });
    // 응답 상태와 관계없이 일단 JSON 파싱 시도
    const data = await res.json();

    let assistantMessage;
    if (!res.ok) {
      // 서버가 에러 메시지(data.error, data.detail)를 보낸 경우
      const errorTitle = data.error || "요청 처리 중 오류가 발생했습니다.";
      const errorDetail = data.detail || `서버 응답 코드: ${res.status}`;
      assistantMessage = {
        role: 'assistant',
        content: `**${errorTitle}**\n\n${errorDetail}`
      };
    } else {
      // 성공 시
      let content = data.content || "(응답 없음)";
      // 모델 정보가 있으면 응답 하단에 추가
      if (data.model_used) {
        content += `\n\n---\n*🤖 응답 모델: ${data.model_used}*`;
      }
      assistantMessage = {
        role: 'assistant',
        content: content,
        notice: data.notice || null
      };
    }
    state.messages.push(assistantMessage);

  } catch (err) {
    // 네트워크 오류 또는 JSON 파싱 실패
    state.messages.push({ role: 'assistant', content: `요청 오류: \`${err.message}\`` });
  } finally {
    state.sending = false;
    sendBtn.disabled = false;
    sendBtn.textContent = '보내기';
    render(); // 최종 결과 렌더링
    // 응답 후 최근 대화 목록 업데이트 (대화가 완전히 끝난 후 1번만)
    addRecentPreview(); 
  }
}


// Health Check
async function health() { 
  try { 
    const r = await fetch(ENDPOINT.health, { 
      cache: 'no-store',
      method: 'GET'
    }); 
    if (r.ok) {
      const data = await r.json();
      const ok = data.ok === true;
      healthDot.classList.toggle('ok', ok); 
      healthDot.classList.toggle('err', !ok);
      console.log('[Health Check] OK:', ok);
    } else {
      healthDot.classList.remove('ok'); 
      healthDot.classList.add('err');
      console.warn('[Health Check] Failed - Status:', r.status);
    }
  } catch (err) { 
    healthDot.classList.remove('ok'); 
    healthDot.classList.add('err');
    console.error('[Health Check] Error:', err);
  } 
}

// Recents (in-memory)
function addRecentPreview() {
  // 메시지가 없으면 추가하지 않음
  if (state.messages.length === 0) return;
  
  // 첫 사용자 메시지 찾기 (없으면 추가 안 함)
  const firstUserMessage = state.messages.find(m => m.role === 'user');
  if (!firstUserMessage) return;

  const newRecent = {
    // 제목은 첫 사용자 메시지로, 너무 길면 자름
    title: firstUserMessage.content.substring(0, 24) + (firstUserMessage.content.length > 24 ? '...' : ''),
    ts: Date.now(),
    // 현재 대화 상태 전체를 문자열로 저장
    snapshot: JSON.stringify(state.messages) 
  };

  // 기존 recents 배열에서 같은 제목을 가진 최근 항목 제거 (중복 방지 - 제목 기준)
  state.recents = state.recents.filter(r => r.title !== newRecent.title);

  // 맨 앞에 새 항목 추가
  state.recents.unshift(newRecent);
  // 최대 15개만 유지
  state.recents = state.recents.slice(0, 15);
  // 화면 다시 그리기
  renderRecents();
}
